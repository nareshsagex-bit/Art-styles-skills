<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butterfly · Colour ASCII</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  body[data-theme="dark"] { background: #12081a; }
  #source { display: none; }
  #ascii { display: block; width: 100vw; height: 100svh; }
</style>
<script defer src="../../scripts/ascii-renderer.js"></script>
<script defer src="butterfly.js"></script>
</head>
<!-- Set data-theme="dark" for the glowing poster look on near-black. -->
<body data-theme="light">
  <canvas id="source" aria-hidden="true"></canvas>
  <canvas id="ascii" aria-label="Colour ASCII art of a butterfly flapping over swaying flowers"></canvas>
</body>
</html>
